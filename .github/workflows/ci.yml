name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @loopedu/shared build
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit tests; the migration test runs on in-process Postgres (PGlite), no service needed.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @loopedu/api test:e2e
      - run: pnpm --filter @loopedu/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Build only (no push): proves both production images still build.
      - run: docker build -f apps/api/Dockerfile -t loopedu-api .
      - run: docker build -f apps/web/Dockerfile -t loopedu-web .
